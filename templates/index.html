<!DOCTYPE html>
<html>
<head>
    <title>2026 AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl">
        <h1 class="text-2xl font-bold mb-4 border-b border-gray-700 pb-2">Agentic Orchestrator</h1>
        <div id="chat-box" class="h-80 overflow-y-auto mb-4 space-y-2 p-2 bg-gray-700 rounded"></div>
        <div class="flex gap-2">
            <input id="user-input" class="flex-1 p-2 rounded bg-gray-600 outline-none" placeholder="Ask the agent...">
            <button onclick="sendMessage()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500">Send</button>
        </div>
    </div>

    <script>
    async function sendMessage(action = null) {
    const input = document.getElementById('user-input');
    const box = document.getElementById('chat-box');
    const btnContainer = document.getElementById('approval-container');
    
    let message = input.value;
    if (!message && !action) return;

    // Display user message
    if (!action) {
        box.innerHTML += `<div class="text-right"><p class="inline-block bg-blue-600 p-2 rounded-lg mb-2"><b>You:</b> ${message}</p></div>`;
    } else {
        btnContainer.classList.add('hidden');
    }

    try {
        const response = await fetch('', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: message, action: action })
        });
        
        const data = await response.json();
        
        // Display AI message
        box.innerHTML += `<div class="text-left"><p class="inline-block bg-gray-700 p-2 rounded-lg mb-2"><b>Agent:</b> ${data.response}</p></div>`;
        
        if (data.is_pending) {
            btnContainer.classList.remove('hidden');
        }
        
        box.scrollTop = box.scrollHeight; // Auto-scroll
        input.value = '';
    } catch (error) {
        console.error("Error:", error);
    }
}
</script>

<div id="approval-container" class="hidden mt-4 p-3 border border-yellow-500 rounded bg-yellow-900/20">
    <p class="text-sm mb-2 text-yellow-200 underline">Agent is requesting tool access. Approve?</p>
    <div class="flex gap-4">
        <button onclick="sendMessage('approve')" class="bg-green-600 px-3 py-1 rounded text-sm">Approve ✅</button>
        <button onclick="sendMessage('reject')" class="bg-red-600 px-3 py-1 rounded text-sm">Reject ❌</button>
    </div>
</div>
</body>
</html>
